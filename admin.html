<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-container">
        <header>
            <h1>Quiz Admin Panel</h1>
            <div class="actions">
                <button id="add-btn" class="btn primary">Add New Question</button>
                <button id="export-json-btn" class="btn secondary">Export JSON</button>
                <button id="download-template-btn" class="btn secondary">Template JSON</button>
                <label for="import-json" class="btn secondary" style="cursor: pointer;">
                    Import JSON
                    <input type="file" id="import-json" accept=".json" style="display: none;">
                </label>
            </div>
        </header>

        <div class="filter-bar">
            <input type="text" id="search-input" placeholder="Search questions..." class="search-input">
            <select id="level-filter" class="filter-select">
                <option value="all">All Levels</option>
                <option value="1">1 - Text</option>
                <option value="3">3 - Audio</option>
            </select>
        </div>

        <table id="questions-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Level</th>
                    <th>Question</th>
                    <th>A</th>
                    <th>B</th>
                    <th>C</th>
                    <th>D</th>
                    <th>Answer</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Populated by JS -->
            </tbody>
        </table>
    </div>

    <!-- Modal for Add/Edit -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Add Question</h2>
            <form id="question-form">
                <input type="hidden" id="q-id">
                <div class="form-group">
                    <label>Level</label>
                    <select id="q-level" required>
                        <option value="1">1 - Text</option>
                        <option value="3">3 - Audio</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Question Text (Optional for Audio)</label>
                    <textarea id="q-text"></textarea>
                </div>
                <div class="form-group">
                    <label>Audio URL (For Level 3)</label>
                    <input type="text" id="q-audio-url" placeholder="https://example.com/audio.mp3">
                </div>
                <div class="form-group">
                    <label>Image URL (Optional)</label>
                    <input type="text" id="q-image-url" placeholder="https://example.com/image.jpg">
                </div>
                <div class="form-group">
                    <label>Option A</label>
                    <input type="text" id="q-opt-a" required>
                </div>
                <div class="form-group">
                    <label>Option B</label>
                    <input type="text" id="q-opt-b" required>
                </div>
                <div class="form-group">
                    <label>Option C</label>
                    <input type="text" id="q-opt-c" required>
                </div>
                <div class="form-group">
                    <label>Option D</label>
                    <input type="text" id="q-opt-d" required>
                </div>
                <div class="form-group">
                    <label>Correct Answer</label>
                    <select id="q-ans" required>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancel-btn" class="btn secondary">Cancel</button>
                    <button type="submit" class="btn primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
